<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ma Mini App Telegram</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #f2f2f2;
      color: #222;
    }

    .app {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
    }

    button {
      border: none;
      padding: 15px 25px;
      border-radius: 12px;
      font-size: 17px;
      cursor: pointer;
      background: #0088cc;
      color: white;
    }

    button:active {
      transform: scale(0.97);
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>🚀 Ma Mini App</h1>

    <p id="bonjour">Bienvenue 👋</p>

    <button onclick="bonjour()">
      Cliquer ici
    </button>

    <div id="message"></div>

<h2>🌿 Jaune spé</h2>

<button onclick="choisirPrix(30)">30 €</button>
<button onclick="choisirPrix(60)">60 €</button>
<button onclick="choisirPrix(180)">180 €</button>

<p id="prixChoisi"></p>

<button onclick="commander()">🛒 Commander</button>

  </div>

  <script>

    // Connexion avec Telegram
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    // Récupérer le prénom de l'utilisateur Telegram
    if (tg.initDataUnsafe &&
        tg.initDataUnsafe.user &&
        tg.initDataUnsafe.user.first_name) {

      const prenom = tg.initDataUnsafe.user.first_name;

      document.getElementById("bonjour").innerText =
        "Bonjour " + prenom + " 👋";
    }
function choisirPrix(prix) {
  document.getElementById("prixChoisi").innerText =
    "Montant choisi : " + prix + " €";
}

function commander() {
  const prix = document.getElementById("prixChoisi").innerText;

  if (!prix) {
    alert("Choisis d'abord un montant.");
    return;
  }

  alert("Commande : " + prix);
}
    // Action du bouton
window.bonjour = function() {

      document.getElementById("message").innerText =
        "🎉 Ça fonctionne !";

      // Retour haptique sur les téléphones compatibles
      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred("light");
      }
    }

  </script>

</body>
</html>
